<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>X Media Assist</title><link rel="stylesheet" href="../Style.css"><script src="../Script.js" defer></script></head>
<body><main><div class="symbol" aria-hidden="true">↓</div><h1>X Media Assist</h1><p class="intro">公開ポストの動画を、Macへ。</p>
<p class="state-unknown">Safariの設定で拡張機能を有効にしてください。</p><p class="state-on">Safari拡張機能は有効です。</p><p class="state-off">Safari拡張機能は無効です。</p>
<ol><li>Safariの「設定 → 拡張機能」で有効にします。</li><li>Xのポストを開き、サイトへのアクセスを許可します。</li><li>「MP4を保存」でダウンロードフォルダに保存します。</li></ol>
<button class="open-preferences">Safariの拡張機能設定を開く</button><p id="error" role="status"></p><p class="note">GIF投稿もMP4で保存します。GIFへの変換は次段階です。<br>ポスト内にボタンがない場合は、Safariの拡張ボタンからURLを入力できます。</p></main></body></html>
