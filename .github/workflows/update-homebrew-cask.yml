name: Update Homebrew Cask

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  update-homebrew-cask:
    # Pre-release は Homebrew Cask に流さない
    if: ${{ github.event.release.prerelease == false }}

    runs-on: ubuntu-latest

    env:
      TAP_REPOSITORY: jemielttf/homebrew-tap
      CASK_PATH: Casks/x-media-assist.rb

    steps:
      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Stable release のタグだけ許可する
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG_NAME" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          ASSET_NAME="X-Media-Assist-${VERSION}.zip"

          echo "Version: $VERSION"
          echo "Asset:   $ASSET_NAME"

          DIGEST="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq ".assets[] | select(.name == \"${ASSET_NAME}\") | .digest"
          )"

          if [[ -z "$DIGEST" ]]; then
            echo "Release asset not found: $ASSET_NAME" >&2
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid asset digest: $DIGEST" >&2
            exit 1
          fi

          SHA256="${DIGEST#sha256:}"

          echo "SHA256:  $SHA256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jemielttf/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          path: homebrew-tap
          fetch-depth: 0

      - name: Update Cask
        id: update
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Casks/x-media-assist.rb")
          content = path.read_text()

          content, version_count = re.subn(
              r'^  version "[^"]+"$',
              f'  version "{os.environ["VERSION"]}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          content, sha_count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{os.environ["SHA256"]}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if version_count != 1:
              raise SystemExit("Could not update version in Cask")

          if sha_count != 1:
              raise SystemExit("Could not update sha256 in Cask")

          path.write_text(content)
          PY

          git diff --check

          if git diff --quiet -- "$CASK_PATH"; then
            echo "Cask is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cask changes:"
            git diff -- "$CASK_PATH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push update branch
        if: steps.update.outputs.changed == 'true'
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/x-media-assist-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-run 時も同じブランチを更新できるようにする
          git fetch origin "$BRANCH" || true
          git switch -C "$BRANCH" origin/main

          git add "$CASK_PATH"
          git commit -m "Update X Media Assist to ${VERSION}"

          git push --force-with-lease origin "HEAD:${BRANCH}"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/x-media-assist-${VERSION}"
          TITLE="Update X Media Assist to ${VERSION}"

          PR_NUMBER="$(
            gh pr list \
              --repo "$TAP_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$PR_NUMBER" ]]; then
            echo "Open pull request already exists: #${PR_NUMBER}"
            exit 0
          fi

          gh pr create \
            --repo "$TAP_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$(cat <<EOF
          Updates X Media Assist to ${VERSION}.

          - Release: ${RELEASE_URL}
          - SHA256: \`${SHA256}\`

          This pull request was generated automatically from the X Media Assist GitHub Release.
          EOF
          )"