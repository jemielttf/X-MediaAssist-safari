name: Syndication Canary

# X の公開 Syndication 応答が変わっていないかを毎日確認する。
# 失敗すると GitHub から通知が届く。60日間リポジトリに動きがないと定期実行は自動で停止する。
on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ランナーにプリインストールされている Node を使う（fetch と AbortSignal.timeout が必要）
      - name: Check Syndication responses
        run: |
          node --version
          node script/check_syndication.mjs
