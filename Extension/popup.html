<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>X Media Assist</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<h1>X Media Assist</h1>
		<p>動画はMP4、GIFアニメはGIFで保存します。</p>
		<form id="download-form">
			<label for="post-url">投稿のURL :</label>
			<input id="post-url" type="url"
				placeholder="https://x.com/…/status/…" required autocomplete="off">

			<fieldset class="format-options" aria-labelledby="format-label">
				<span id="format-label">保存形式 :</span>
				<label><input type="radio" name="format" value="auto" checked> Auto</label>
				<label><input type="radio" name="format" value="mp4"> MP4</label>
			</fieldset>

			<fieldset id="gif-options" class="gif-options" aria-describedby="gif-state" disabled>
                <legend>GIF設定 <span class="gif-scope">今回のみ</span></legend>
                <p id="gif-state" class="gif-description" role="status">基本設定を読み込み中…</p>
                <div class="gif-option-row">
                    <label for="gif-quality">画質</label>
                    <select id="gif-quality"><option value="90">高</option><option value="75">中</option><option value="50">低</option></select>
                </div>
                <div class="gif-option-row">
                    <label for="gif-fps">最大フレームレート</label>
                    <select id="gif-fps" aria-describedby="gif-timing-note"><option value="30">30 fps</option><option value="25">25 fps</option><option value="20" selected>20 fps</option><option value="15">15 fps</option></select>
                </div>
                <div class="gif-option-row">
                    <label for="gif-scale">出力サイズ</label>
                    <select id="gif-scale" aria-describedby="gif-size-note"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
                </div>
                <div class="gif-help">
                    <p id="gif-timing-note">元のタイミングを保ち、上限を目安に間引きます。元よりフレーム数を増やしません。</p>
                    <p id="gif-size-note">サイズは縦横比を保って縮小します。</p>
                </div>
            </fieldset>
			<button id="save" type="submit">動画を保存</button>
		</form>
		<p id="status" role="status" aria-live="polite"></p>
		<p class="note">
			保存先：ダウンロードフォルダ<br>GIFに変換できなかった場合は、MP4で保存します。
		</p>
		<p class="note">
			<a href="Licenses/index.html" target="_blank">ライセンス・著作権表示</a>
		</p>
		<script src="core.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
