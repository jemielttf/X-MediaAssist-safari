<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Media Assist</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>X Media Assist</h1><p>通常動画はMP4、GIF投稿はGIFで保存します。</p>
<form id="download-form"><label for="post-url">ポストのURL</label><input id="post-url" type="url" placeholder="https://x.com/…/status/…" required autocomplete="off"><label for="format">保存形式</label><select id="format"><option value="auto">自動（動画はMP4・GIF投稿はGIF）</option><option value="mp4">MP4</option></select><button id="save" type="submit">動画を保存</button></form>
<p id="status" role="status" aria-live="polite"></p><p class="note">保存先：ダウンロードフォルダ<br>GIF変換に失敗した場合はMP4を残します。<br><a href="Licenses/index.html" target="_blank">ライセンス・著作権表示</a></p>
<script src="core.js"></script><script src="popup.js"></script></body></html>
