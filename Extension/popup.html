<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>X Media Assist</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<h1>X Media Assist</h1>
		<p>動画はMP4、GIFアニメはGIFで保存します。</p>
		<form id="download-form">
			<label for="post-url">投稿のURL :</label>
			<input id="post-url" type="url"
				placeholder="https://x.com/…/status/…" required autocomplete="off">

			<fieldset class="format-options" aria-labelledby="format-label">
				<span id="format-label">保存形式 :</span>
				<label><input type="radio" name="format" value="auto" checked> Auto</label>
				<label><input type="radio" name="format" value="mp4"> MP4</label>
			</fieldset>

			<fieldset id="gif-options" class="gif-options" disabled>
                <legend>GIF設定</legend>
                <label for="gif-quality">GIF Quality</label>
                <select id="gif-quality"><option value="90">High</option><option value="75">Medium</option><option value="50">Low</option></select>
                <label for="gif-fps">Max frame rate</label>
                <select id="gif-fps"><option value="30">30 fps</option><option value="25">25 fps</option><option value="20" selected>20 fps</option><option value="15">15 fps</option></select>
                <label for="gif-scale">GIF Size</label>
                <select id="gif-scale"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
                <p class="note">元のタイミングを保ち、指定値を目安にフレーム数を抑えます。低fpsの映像は増やしません。</p>
            </fieldset>
            <p class="note">GIF設定は今回の保存だけに適用します。MP4選択時は使用しません。</p>
			<button id="save" type="submit">動画を保存</button>
		</form>
		<p id="status" role="status" aria-live="polite"></p>
		<p class="note">
			保存先：ダウンロードフォルダ<br>GIFに変換できなかった場合は、MP4で保存します。
		</p>
		<p class="note">
			<a href="Licenses/index.html" target="_blank">ライセンス・著作権表示</a>
		</p>
		<script src="core.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
