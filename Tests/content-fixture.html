<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>X Media Assist UI fixture</title><link rel="stylesheet" href="../Extension/content.css">
<style>body{font:16px/1.6 system-ui;max-width:620px;margin:40px auto;padding:20px}article{border:1px solid #aaa;border-radius:12px;padding:20px;margin:20px 0}video{display:block;width:100%;height:160px;background:#222}button{padding:8px}#requests{white-space:pre-wrap}</style></head><body>
<h1>投稿UIの隔離テスト</h1><p>実通信・ファイル保存は行わず、拡張機能の返信を模擬します。</p>
<p><a href="?lang=ja">日本語</a> | <a href="?lang=en">English</a></p>
<button id="recycle">同じDOMを別ポストへ再利用</button> <button id="toggle">次の保存を失敗させる</button>
<button id="reinject">スクリプトを再実行</button>
<p id="check" role="status"></p>
<button id="legacy">旧版の監視処理との共存を検証</button><p id="legacy-check" role="status"></p>
<article data-testid="tweet"><a id="permalink" href="https://x.com/example/status/719944021058060289"><time>2026年9月21日</time></a><p>公開動画のテスト投稿（再生前のサムネイル表示）</p><div data-testid="tweetPhoto"><div data-testid="previewInterstitial"><button data-testid="playButton">この動画を再生する</button></div></div><div role="group"><button data-testid="reply">返信</button></div></article>
<pre id="requests" role="status"></pre>
<p>2ボタンのレイアウト確認（保存処理なし）</p>
<div class="xma-controls" id="layout-example"><div class="xma-item"><button class="xma-save">↓ 動画を保存</button><span class="xma-status"></span></div><div class="xma-item"><button class="xma-save">↓ 動画を保存</button><span class="xma-status"></span></div></div>
<script>
let fail = false;
let count = 0;
globalThis.browser = { runtime: { sendMessage: async message => {
 if (message.type === 'checkConnection') return {ok:true,instance:'fixture'};
 document.querySelector('#requests').textContent = JSON.stringify({count: ++count, ...message});
 await new Promise(done => setTimeout(done, 250));
 return fail ? {ok:false,saved:[],error:'テスト用の通信失敗です。'} : {ok:true,saved:[`example-${message.postId}-1.mp4`]};
}}};
document.querySelector('#recycle').onclick = () => document.querySelector('#permalink').href = 'https://x.com/example/status/1234567890';
document.querySelector('#toggle').onclick = () => {fail = !fail;};
document.querySelector('#reinject').onclick = () => {
 const script = document.createElement('script');
 script.src = '../Extension/content.js';
 script.onload = () => {
  const count = document.querySelectorAll('article .xma-controls[data-post-id] .xma-save').length;
  const [a,b] = [...document.querySelectorAll('#layout-example .xma-save')].map(button => button.getBoundingClientRect());
  const horizontal = Math.abs(a.top - b.top) < 1 && b.left > a.right;
  document.querySelector('#check').textContent = count === 1 && horizontal ? 'PASS: 再実行後も投稿ボタン1個・2ボタンは横並び' : `FAIL: count=${count}, horizontal=${horizontal}`;
 };
 document.body.append(script);
};
document.querySelector('#legacy').onclick = () => {
 const article = document.querySelector('article');
 const old = document.createElement('div'); old.className = 'xma-controls';
 old.innerHTML = '<button class="xma-save">旧版ボタン</button>';
 let repairs = 0;
 article.append(old);
 const observer = new MutationObserver(() => {
  if (!old.isConnected) { repairs++; article.append(old); }
 });
 observer.observe(article, {subtree:true, childList:true});
 setTimeout(() => {
  observer.disconnect();
  const current = article.querySelectorAll('.xma-controls[data-post-id] .xma-save').length;
  const hidden = getComputedStyle(old).display === 'none';
  document.querySelector('#legacy-check').textContent = repairs === 0 && current === 1 && hidden
   ? 'PASS: 3秒間の旧版再追加0回・表示ボタン1個'
   : `FAIL: repairs=${repairs}, current=${current}, hidden=${hidden}`;
  old.remove();
 }, 3000);
};
</script><script type="module">
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ja';
const messages = await (await fetch(`../Extension/_locales/${lang}/messages.json`)).json();
browser.i18n = {getMessage: (key, values = []) => messages[key]?.message.replace(/\$(\d+)/g, (_, n) => values[Number(n) - 1] ?? '') ?? ''};
for (const name of ['i18n', 'core', 'content']) await import(`../Extension/${name}.js`);
</script></body></html>
