<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Media Assist</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="popup">
<main class="app">
  <h1>X Media Assist</h1>
  <p class="lead">動画はMP4、GIFアニメはGIFで保存します。</p>

  <div class="field">
    <label class="label" for="url">投稿のURL</label>
    <input class="input" id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://x.com/example/status/123">
  </div>

  <div class="field">
    <span class="label" id="l-fmt">保存形式</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-fmt">
      <label><input type="radio" name="fmt" value="auto" checked><span>Auto</span></label>
      <label><input type="radio" name="fmt" value="mp4"><span>MP4</span></label>
    </div>
  </div>

  <section class="card gif" id="gif">
    <div class="head"><h2>GIF設定</h2><span class="tag">今回のみ</span></div>
    <p class="hint">ここでの変更は基本設定に保存されません。</p>

    <div class="row">
      <span class="label" id="l-q">画質</span>
      <div class="seg" role="radiogroup" aria-labelledby="l-q">
        <label><input type="radio" name="q" value="高"><span>高</span></label>
        <label><input type="radio" name="q" value="中" checked><span>中</span></label>
        <label><input type="radio" name="q" value="低"><span>低</span></label>
      </div>
    </div>
    <div class="row">
      <span class="label" id="l-f">最大フレームレート</span>
      <div class="seg" role="radiogroup" aria-labelledby="l-f">
        <label><input type="radio" name="f" value="30"><span>30 fps</span></label>
        <label><input type="radio" name="f" value="25" checked><span>25 fps</span></label>
        <label><input type="radio" name="f" value="20"><span>20 fps</span></label>
        <label><input type="radio" name="f" value="15"><span>15 fps</span></label>
      </div>
    </div>
    <div class="row">
      <span class="label" id="l-s">出力サイズ</span>
      <div class="seg" role="radiogroup" aria-labelledby="l-s">
        <label><input type="radio" name="s" value="100"><span>100%</span></label>
        <label><input type="radio" name="s" value="75" checked><span>75%</span></label>
        <label><input type="radio" name="s" value="50"><span>50%</span></label>
      </div>
    </div>
    <!-- <p class="note">元のタイミングを保ち、上限を目安に間引きます。元よりフレーム数を増やしません。サイズは縦横比を保って縮小します。</p> -->
  </section>

  <button class="btn" type="button" id="save">動画を保存</button>

  <div class="foot-note">
    <p>保存先：ダウンロードフォルダ</p>
    <p>GIFに変換できなかった場合は、MP4で保存します。</p>
  </div>
  <button class="link" type="button">ライセンス・著作権表示</button>
</main>
<script>
// MP4固定のときはGIF設定を無効表示にする（見た目のみ）
document.addEventListener('change',function(e){
  if(e.target.name!=='fmt')return;
  document.getElementById('gif').toggleAttribute('inert',e.target.value==='mp4');
});
</script>
</body>
</html>
